name = "{{name}}"
entry = "main.aura"
preset = "dev"
out = "out"

# The aura release this project was made with; .github/workflows/ci.yml runs
# the ghcr.io/cybrid-systems/aura image with the same tag. require paths
# resolve from the project root, std/* ships with aura.
[dependencies]
aura = "{{channel}}"
