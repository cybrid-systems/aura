name: Install clang-scan-deps 23.1.5
description: >-
  Use clang-scan-deps when it is already installed and reports LLVM 23.1.5,
  the same release as aura-ci's clang++. The actions cache and the official
  llvmorg-23.1.5 tarball run only when that binary is missing or is a
  different version. A matching image binary is not replaced. Not
  clang-tools-22.

runs:
  using: composite
  steps:
    - name: Restore clang-scan-deps
      id: cache
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.cache/clang-scan-deps
        key: clang-scan-deps-23.1.5-${{ runner.arch }}-392dfff97d29
    - name: Install clang-scan-deps next to clang++
      shell: bash
      env:
        SCAN_DEPS_CACHE: ${{ github.workspace }}/.cache/clang-scan-deps
      run: bash scripts/ci/install_clang_scan_deps.sh
