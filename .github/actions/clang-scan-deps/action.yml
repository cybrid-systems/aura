name: Locate clang-scan-deps
description: >-
  Use the clang-scan-deps shipped in the aura-ci image that matches the
  clang++ selected for this job. The path is exported for CMake. A missing
  or different scanner fails the job. Nothing is downloaded and the image
  copy is not replaced.

outputs:
  path:
    description: Absolute path of the matching clang-scan-deps.
    value: ${{ steps.locate.outputs.path }}

runs:
  using: composite
  steps:
    - name: Locate clang-scan-deps next to clang++
      id: locate
      shell: bash
      run: bash scripts/ci/install_clang_scan_deps.sh
