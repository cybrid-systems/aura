name: Link libgit2 Kerberos libraries
description: >-
  aura-ci:v0.1.0's libgit2 CMake target lists unversioned
  libgssapi_krb5.so paths. libkrb5-dev provides those names.
  The runtime image ghcr.io/cybrid-systems/aura is not involved.

runs:
  using: composite
  steps:
    - name: Install libkrb5-dev
      shell: bash
      run: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        sudo mkdir -p /var/lib/apt/lists/partial
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends libkrb5-dev
        sudo ls /usr/lib/*/libgssapi_krb5.so /usr/lib/*/libkrb5.so \
          /usr/lib/*/libk5crypto.so /usr/lib/*/libcom_err.so
