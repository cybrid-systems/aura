# Aura CI — canonical workflow (Issue #1570 path map)
#
# THIS IS THE ONLY PR/main CI entrypoint.
# Nightly stress, nightly version tag, and release live beside this file:
# nightly.yml, nightly-version.yml, release.yml.
#
# Wall-time layout (target):
#   PR:
#     gate (~1m) ── parallel ──► build-test (~10–15m: build + core/safety + issues?)
#     security-scan ────────────► (no gate wait)
#   main (push):
#     same as PR, plus ubsan-smoke / asan / repro / deploy-health / bench
#
# PR optimisations:
#   - one live CI run per open PR, and one per branch on main; cancel the rest
#   - drop PR-side full rebuild jobs (s0-smoke + ubsan-smoke)
#   - security-scan no longer needs: [gate]
#   - gate: remove non-blocking clang-tidy
#   - skip apt when mold/lld already on the image
#   - paths-filter: docs-only PRs run gate only (no full C++ build)
#   - (2026-08) gate ‖ build-test (build-test no longer waits on gate)
#   - (2026-08) PR bench --strict → main-only
#   - (2026-08) PR AURA_ISSUE_BUILD=none when issue_matrix paths untouched
#   - (2026-08) aura then test_ir, then test_concurrent+issue ninja; -g1
#   - (2026-08) shallow checkout on main push (full history only on PR)
#   - (2026-08) BMI symlink fan-out only to this-run consumer dirs
#   - (2026-08) cheap/medium tests overlap remaining ninja after aura+test_ir
#   - (2026-08) bash harness fans out on AURA_CASE_JOBS (process-isolated)
#   - (2026-09) concurrent runs right after isolate compile (before issues);
#     concurrent compile fail does not skip the issue farm; no ICE retry
#     on deterministic -Werror for test_concurrent
#   - (2026-09) issue serial recovery = crash/timeout/rc=127 only (not AC)
#   - (2026-09) asan/ubsan slim matrix includes test_concurrent
#   - (2026-09) build-test timeout-minutes=120 (default 360 hid hangs)
#   - (2026-09) asan-verify timeout-minutes=40 (tests-only; default 360
#     hid hangs). concurrent skips stdbuf under asan (libstdbuf.so
#     before libasan aborts at startup).
#   - (2026-11) ASAN verify folded into asan-build: the separate job's
#     second ~10GB dev-image pull failed at container init and skipped all
#     tests. Per-step timeout-minutes keeps the 40-min hang budget.
#   - (2026-09) test_ir + test_concurrent share aura_serve_fiber_objects
#   - (2026-09) PR fast includes densify_pin + orch_agent batches
#   - (2026-09) heavy issue bins live-stream stdout (hangs visible)
#   - (2026-09) deployment-health reuses build-test aura artifact
#   - (2026-11, #4819) issue farm → issue-farm matrix (4 shards ‖
#     build-test); build-test was ~85m of issue ninja on one runner
#   - (2026-11) aura executable is built once in aura-bin, in parallel
#     with the shards. Shards still compile aura_test_objects + their
#     slice (different module flags; a prerequisite job would add that
#     compile to the wall). Measured shard 4 on run 42066633273:
#     aura 11m, test objects ~20m, slice ~16m, tests ~3m.
#   - (2026-11) ubsan-smoke and reproducible-build start with the other
#     main jobs. They do not consume a gate artifact.
#   - (2026-11) heavy compile jobs use vars.AURA_HEAVY_RUNNER when that
#     repo/org variable is a real larger-runner label. Unset stays
#     ubuntu-latest. A label that was never created queues forever.
#     Sanitizer link pool stays 1 (#2636 deadlock, not a RAM cap).
#
# Branch protection: require both `gate` and `build-test` (not only one).
#
# Developer map: docs/test_harness_pattern.md
# Platforms: docs/ci-platforms.md (#1573)

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A new push cancels the previous run on that PR, or on main, as soon as
# the run is created — concurrency does not wait for a runner. That keeps
# one run, not three. prune-stale-ci is the backup for runs that started
# before this group existed, and for pull_request runs whose PR is already
# merged or closed: those are a different event and branch, so the main
# concurrency group does not see them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  AURA_BUILD_TYPE: RelWithDebInfo
  AURA_BUILD_JOBS: "0"  # 0 → use all host CPUs in build.py
  AURA_CI: "1"  # skip issues happy-path ninja refresh; recovery still rebuilds crashes
  # Suite-level cap. cmd_test waves (cheap→medium→heavy→stress) derive inner
  # AURA_SUITE_JOBS / AURA_ISSUES_JOBS / AURA_CASE_JOBS as nproc // live_suites
  # so 4 overlapping heavies cannot multiply into 4×3×4 processes on 4 vCPU.
  AURA_TEST_JOBS: "4"
  AURA_SUITE_JOBS: "3"
  AURA_CASE_JOBS: "2"
  AURA_ISSUES_JOBS: "4"
  # Cross-run ccache caused stale-object flakes; compile fresh every job.
  CCACHE_DISABLE: 1
  # Issue #873/#874 Phase 1
  # Prefer mold for wall time, but keep link pool ≤2: concurrent mold
  # of 400+ × ~70MB LLVM test binaries thrashs runner RAM/disk and
  # dies with "mold: failed to write… Disk full? / SIGBUS".
  AURA_USE_MOLD: "1"
  AURA_LINK_JOBS: "2"
  NINJA_STATUS: "[%f/%t %es] "
  # Issue #1569: hard benchmark SLO — enforced on main build-test only
  # (see bench step `if:`). Keep env default off so accidental local/PR
  # invocations of build.py bench without --strict stay soft.
  AURA_CI_STRICT_BENCH: "0"

jobs:
  # ubuntu-latest (not the dev container) so gh is on PATH. Not a required
  # check — failure here must not block gate / build-test.
  prune-stale-ci:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
    - name: Cancel superseded CI runs
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
        BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        set -euo pipefail
        echo "prune: current=${GITHUB_RUN_ID} event=${EVENT_NAME} pr=${PR_NUMBER} branch=${BRANCH_NAME}"
        python3 - <<'PY'
        import json, os, subprocess, sys
        from collections import defaultdict

        current = int(os.environ["GITHUB_RUN_ID"])
        event = os.environ["EVENT_NAME"]
        branch = os.environ["BRANCH_NAME"]
        repo = os.environ["GITHUB_REPOSITORY"]
        live_status = {"in_progress", "queued", "waiting", "pending", "requested"}

        def gh_json(path):
            out = subprocess.check_output(["gh", "api", path], text=True)
            return json.loads(out)

        def list_live():
            runs = []
            seen = set()
            # Status filters, not "newest 50 of any status": completed runs
            # were filling that page and live merged-PR runs never appeared.
            for status in ("queued", "in_progress", "waiting", "requested"):
                page = 1
                while page <= 10:
                    try:
                        data = gh_json(
                            "repos/" + repo + "/actions/workflows/ci.yml/runs"
                            "?status=" + status + "&per_page=100&page=" + str(page)
                        )
                    except subprocess.CalledProcessError as exc:
                        print(
                            f"warn: list {status} page {page} failed (rc={exc.returncode})",
                            file=sys.stderr,
                        )
                        break
                    batch = data.get("workflow_runs") or []
                    for run in batch:
                        run_id = int(run["id"])
                        if run_id not in seen:
                            seen.add(run_id)
                            runs.append(run)
                    if len(batch) < 100:
                        break
                    page += 1
            return runs

        def load_open():
            branches = set()
            shas = set()
            page = 1
            while page <= 10:
                try:
                    data = gh_json(
                        "repos/" + repo + "/pulls?state=open&per_page=100&page=" + str(page)
                    )
                except subprocess.CalledProcessError as exc:
                    print(
                        f"warn: open PR list failed (rc={exc.returncode}); only trimming this branch",
                        file=sys.stderr,
                    )
                    return None
                if not isinstance(data, list):
                    print(
                        "warn: open PR list was not a list; only trimming this branch",
                        file=sys.stderr,
                    )
                    return None
                for pr in data:
                    head = pr.get("head") or {}
                    if head.get("ref"):
                        branches.add(head["ref"])
                    if head.get("sha"):
                        shas.add(head["sha"])
                if len(data) < 100:
                    break
                page += 1
            return branches, shas

        def cancels_for(runs, open_prs):
            groups = defaultdict(list)
            for run in runs:
                if run.get("status") not in live_status:
                    continue
                ev = run.get("event")
                if ev not in ("push", "pull_request"):
                    continue
                groups[(ev, run.get("head_branch") or "")].append(run)

            # The list can lag the run that is executing this step.
            if not any(int(run["id"]) == current for group in groups.values() for run in group):
                groups[(event, branch)].append({
                    "id": current,
                    "event": event,
                    "head_branch": branch,
                    "status": "in_progress",
                    "created_at": "9999-99-99T00:00:00Z",
                    "head_sha": "",
                })

            cancel = []
            for (ev, head_branch), group in groups.items():
                group.sort(key=lambda run: run.get("created_at") or "", reverse=True)
                ids = [int(run["id"]) for run in group]
                own = ev == event and head_branch == branch
                if ev == "pull_request" and open_prs is not None:
                    open_branches, open_shas = open_prs
                    shas = {run.get("head_sha") for run in group}
                    keep_latest = head_branch in open_branches or bool(shas & open_shas)
                elif ev == "push" and open_prs is not None:
                    keep_latest = True
                elif own:
                    keep_latest = True
                else:
                    continue
                keep = set(ids[:1] if keep_latest else [])
                if current in ids:
                    keep.add(current)
                dropped = [run_id for run_id in ids if run_id not in keep]
                if dropped:
                    print(
                        f"group {ev} {head_branch}: live={ids} "
                        f"keep={sorted(keep, reverse=True)} cancel={dropped}"
                    )
                cancel.extend(dropped)
            return cancel

        runs = list_live()
        open_prs = load_open()
        if open_prs is not None:
            print(f"open PRs: branches={len(open_prs[0])} shas={len(open_prs[1])}")
        cancel = cancels_for(runs, open_prs)
        print("cancel:", cancel)
        failed = 0
        for run_id in cancel:
            print(f"cancelling {run_id}")
            rc = subprocess.call(["gh", "run", "cancel", str(run_id), "--repo", repo])
            if rc != 0:
                print(f"warn: could not cancel {run_id} (rc={rc})", file=sys.stderr)
                failed += 1
        if failed:
            print(f"warn: {failed} cancel(s) failed; new run still proceeds", file=sys.stderr)
        PY

  # Cheap filter: docs/chore-only PRs skip the full C++ matrix.
  # issue_matrix: whether to link/run the test_issue_* / domain-batch matrix
  # (skip when only scripts/lib/docs tooling changed — still builds aura).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      issue_matrix: ${{ steps.filter.outputs.issue_matrix }}
    steps:
    - uses: actions/checkout@v7
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          code:
            - 'src/**'
            - 'tests/**'
            - 'lib/**'
            - 'cmake/**'
            - 'CMakeLists.txt'
            - 'build.py'
            - 'requirements-dev.txt'
            - '.github/workflows/ci.yml'
            - 'scripts/**'
            - 'contracts'
            - '.clang-format'
            - '.clang-tidy'
          issue_matrix:
            - 'src/**'
            - 'cmake/**'
            - 'CMakeLists.txt'
            - 'tests/**'
            - 'build.py'
            - 'contracts'

  gate:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cybrid-systems/aura-ci:v0.1.1
    env:
      # Coverage sweep on GH runners: the 14-worker parallel burst SIGKILLs the
      # stdlib oneshot trio's freshly-forked interpreter children (guest-global
      # memory pressure waves; issue #4176 diagnosis, #4152-verified safe
      # value). The interpreter-spawn lane (AURA_COVERAGE_LANE_JOBS=2) + one
      # SIGKILL-retry alone were insufficient on CI hardware.
      AURA_GATE_JOBS: "6"
    steps:
    - uses: actions/checkout@v7
      with:
        # Issue #4936: the changed-lines clang-tidy gate diffs HEAD~1..HEAD.
        fetch-depth: 2

    - uses: ./.github/actions/ci-krb5

    - uses: ./.github/actions/clang-scan-deps
      id: clang-scan-deps

    - uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: pip-${{ runner.os }}-aura-ci-v0.1.1-${{ hashFiles('requirements-dev.txt') }}

    - name: Install Python CI deps
      run: pip install --break-system-packages -r requirements-dev.txt

    # Issue #5201: text pins alone cannot prove the container. Assert the
    # running toolchain is CMake 4.5.0 with the instrumentation API that the
    # performance work (#5202) measures against.
    - name: Toolchain image assertion (#5201)
      run: |
        python3 -c "import json, subprocess; d = json.loads(subprocess.check_output(['cmake', '-E', 'capabilities'])); v = d['version']; assert (v['major'], v['minor']) == (4, 5), v; assert d['instrumentation']['apiVersion'] >= 1, d['instrumentation']; print('cmake', v['string'], 'instrumentation', d['instrumentation']['apiVersion'])"

    - name: Toolchain pins (#5201)
      run: python3 tests/python/test_ci_toolchain_image.py -v

    # gate = docs --check + ruff + clang-format + fixtures + surface audits.
    - name: Static checks (docs + lint + format + fixtures)
      run: python3 build.py gate

    # Issue #4829: run inside the existing gate container so this check does
    # not need a second dev-image pull (and cannot hang on its own container
    # initialization). Baseline holds the existing debt; only new (file,
    # check) findings fail.
    - name: Configure compile_commands.json (clang-tidy)
      run: >
        cmake -S . -B build -G Ninja -Wno-author
        -Werror=experimental -Wpolicy -Wdeprecated -Wstrict -Wnon-target-directive
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: clang-tidy baseline gate (#4829)
      run: python3 scripts/clang_tidy_gate.py --jobs 4

    # Issue #4837: Clang module build. GCC still owns the real build; this
    # configure+build exists only to produce module BMIs and a
    # compile_commands.json that clang-tidy can read for src/core /
    # src/compiler module interface units.
    - name: Configure Clang module build (#4837)
      run: >
        cmake -S . -B build_clang -G Ninja -Wno-author
        -Werror=experimental -Wpolicy -Wdeprecated -Wstrict -Wnon-target-directive
        -DCMAKE_CXX_COMPILER=clang++
        -DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS=${{ steps.clang-scan-deps.outputs.path }}
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Build Clang module BMIs (#4837)
      run: |
        targets=$(python3 scripts/clang_module_targets.py build_clang)
        ninja -C build_clang $targets

    - name: clang-tidy module gate (#4837)
      # service.ixx is a very large module TU; on CI it needs more than the
      # gate's 300 s default (GCC build + clang-tidy), so give the module
      # run a longer per-TU bound instead of recording a parse-error.
      run: python3 scripts/clang_tidy_gate.py --module --db build_clang/compile_commands.json --jobs 4 --timeout 900

    # Issue #4936: C++ Core Guidelines rules (docs/cpp-style.md) on the lines
    # this commit changes. HARD checks fail, SOFT checks are notes until their
    # remediation batch lands. The baseline gates above stay the debt ratchet.
    - name: clang-tidy changed-lines gate (#4936)
      run: python3 scripts/clang_tidy_changed_lines.py --db build_clang/compile_commands.json --jobs 4 --build-bmis

    # Aura philosophy guard: no per-issue plan docs in docs/design/
    - name: "Aura philosophy guard: no docs/design/"
      run: |
        if find docs/design -type f -name '*.md' 2>/dev/null | grep -q .; then
          echo "❌ docs/design/ files exist in working tree — aura philosophy forbids per-issue plan docs" >&2
          find docs/design -type f -name '*.md' | head -10 >&2
          echo "Hint: rm -rf docs/design && git add -A && git commit -m 'chore(docs): remove docs/design/ (aura philosophy)'" >&2
          exit 1
        fi
        echo "aura philosophy guard clean (no docs/design/ files)"


  build-test:
    # Parallel with gate (needs: changes only). Require both jobs in branch protection.
    needs: [changes]
    # Full matrix only when C++/tests/build surface changed (or on main push).
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.code == 'true'
    # #4819: the issue farm moved to the issue-farm shards below; this job
    # is aura + test_ir + test_concurrent + cheap/medium suites (~35m).
    # Default 360m hid hung binaries; 75m is headroom, not the budget.
    timeout-minutes: 75
    runs-on: ${{ vars.AURA_HEAVY_RUNNER || 'ubuntu-latest' }}
    container:
      image: ghcr.io/cybrid-systems/aura-ci:v0.1.1
    steps:
    - uses: actions/checkout@v7
      with:
        # PR issue-fast needs AURA_GIT_BASE in history. Number-as-string:
        # `&& 0 || 1` would coerce 0 to the fallback 1.
        fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

    - uses: ./.github/actions/ci-krb5

    - uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: pip-${{ runner.os }}-aura-ci-v0.1.1-${{ hashFiles('requirements-dev.txt') }}

    - name: Install Python CI deps
      run: pip install --break-system-packages -r requirements-dev.txt

    # Fast linker: only apt if missing (image usually ships one).
    - name: Ensure mold / lld
      run: |
        set -e
        need_apt=0
        command -v mold >/dev/null 2>&1 || need_apt=1
        command -v ld.lld >/dev/null 2>&1 || need_apt=1
        if [ "$need_apt" = 1 ]; then
          apt-get update -qq
          command -v mold >/dev/null 2>&1 || apt-get install -y -qq mold || echo "::warning::mold not installed"
          command -v ld.lld >/dev/null 2>&1 || apt-get install -y -qq lld || echo "::warning::lld not installed"
        fi
        command -v mold >/dev/null 2>&1 && mold --version || true
        command -v ld.lld >/dev/null 2>&1 && ld.lld --version | head -1 || true

    # Summarize path-filter → issue matrix (for logs).
    - name: Issue matrix policy
      run: |
        echo "event=${{ github.event_name }}"
        echo "code=${{ needs.changes.outputs.code }}"
        echo "issue_matrix=${{ needs.changes.outputs.issue_matrix }}"
        echo "AURA_ISSUES_TIER=${{ github.event_name == 'pull_request' && 'fast' || 'full' }}"

    - name: Build & Test
      env:
        AURA_ISSUES_TIER: ${{ github.event_name == 'pull_request' && 'fast' || 'full' }}
        AURA_GIT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        AURA_RUNTIME_DIR: ${{ github.workspace }}
        # #4819: issue/domain-batch binaries are built and run by the
        # issue-farm matrix (one 4-vCPU runner spent ~85m compiling them).
        AURA_ISSUE_BUILD: none
        # RelWithDebInfo -g → -g1: smaller .o / mold RSS. asan/ubsan keep full -g.
        AURA_DEBUG_LEVEL: "1"
      run: python3 build.py ci

    # Main-only: deployment-health reuses this RelWithDebInfo aura
    # instead of compiling it again on a second runner.
    - name: Upload aura (deployment-health)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v7
      with:
        name: aura-relwithdebinfo
        # Preserve workspace-relative paths so download path: . restores
        # build/aura + lib/runtime.c (readyz checks runtime.c is readable).
        path: |
          build/aura
          build/libaura-reflect.so
          build/libaura_tl_arena.so
          lib/runtime.c
        if-no-files-found: error
        retention-days: 1

    # suite-s0 dropped: ./build.py ci already runs full tests/suite/*.aura
    # (which is a superset of SUITE_S0_FILES). Keep a cheap s0 metrics probe.
    # Soft harness env (AURA_SANDBOX=off) — production tree-walker Forbidden
    # (#2213) otherwise exits 1 on unless/hash? even when the probe printed ok.
    - name: "engine:metrics under s0"
      env:
        AURA_RUNTIME_DIR: ${{ github.workspace }}
      run: python3 build.py s0-metrics

    # Issue #4908: cross-mode consistency gate + the DX contract tests
    # (#4899-#4919, #4937). The corpus runs under {default, STRICT=0, force-soa} x
    # {direct, --load} and fails with a diff on any stdout / rc / first-error
    # line:col split not in tests/cross_mode/allowlist.txt. The kit leg runs
    # aura-starter-kits evolve-strategy (latest main, 20 steps) on the same
    # faces and compares summary.json. See docs/cross-mode.md.
    - name: Cross-mode gate + DX contracts (#4908)
      env:
        AURA_RUNTIME_DIR: ${{ github.workspace }}
        KIT_STEPS: "20"
      run: |
        set -e
        git clone -q --depth 1 https://github.com/cybrid-systems/aura-starter-kits "$RUNNER_TEMP/aura-starter-kits"
        export AURA_STARTER_KITS="$RUNNER_TEMP/aura-starter-kits"
        rc=0
        # Issue #5140: test_issue_4856.py pinned the --load/--serve-async-bench
        # diagnostic parity but no workflow glob reached it, so it rotted red.
        for t in tests/python/test_issue_4856.py \
                 tests/python/test_issue_490*.py tests/python/test_issue_491*.py tests/python/test_issue_4937*.py \
                 tests/python/test_issue_4948_help.py tests/python/test_issue_50*.py; do
          echo "::group::$t"
          python3 "$t" || rc=1
          echo "::endgroup::"
        done
        exit $rc

    # Issue #1569: hard SLO gate for compiler pipeline benchmarks.
    # Main only — PR wall time; regressions still caught on merge-to-main.
    # --runs 3: single-run after a cold compile is a 5× flake on vec_basic.
    - name: Benchmark SLO gate (#1569)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        AURA_RUNTIME_DIR: ${{ github.workspace }}
        AURA_CI_STRICT_BENCH: "1"
      run: python3 build.py bench --strict --runs 3

  # One aura executable for every issue shard. Runs beside the farm,
  # not in front of it: shards compile for longer than this job, then
  # install build/aura before tests. Some issue tests spawn that binary.
  aura-bin:
    name: aura-bin
    needs: [changes]
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.issue_matrix == 'true'
    timeout-minutes: 45
    runs-on: ${{ vars.AURA_HEAVY_RUNNER || 'ubuntu-latest' }}
    container:
      image: ghcr.io/cybrid-systems/aura-ci:v0.1.1
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

    - uses: ./.github/actions/ci-krb5

    - uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: pip-${{ runner.os }}-aura-ci-v0.1.1-${{ hashFiles('requirements-dev.txt') }}

    - name: Install Python CI deps
      run: pip install --break-system-packages -r requirements-dev.txt

    - name: Ensure mold / lld
      run: |
        set -e
        need_apt=0
        command -v mold >/dev/null 2>&1 || need_apt=1
        command -v ld.lld >/dev/null 2>&1 || need_apt=1
        if [ "$need_apt" = 1 ]; then
          apt-get update -qq
          command -v mold >/dev/null 2>&1 || apt-get install -y -qq mold || echo "::warning::mold not installed"
          command -v ld.lld >/dev/null 2>&1 || apt-get install -y -qq lld || echo "::warning::lld not installed"
        fi

    - name: Build aura
      env:
        AURA_ISSUE_BUILD: none
        AURA_BUILD_TARGETS: aura
        AURA_DEBUG_LEVEL: "1"
      run: python3 build.py build

    - name: Upload aura
      uses: actions/upload-artifact@v7
      with:
        name: aura-compiler
        path: |
          build/aura
          build/libaura-reflect.so
          build/libaura_tl_arena.so
        if-no-files-found: error
        retention-days: 1

  # Issue #4819: the issue/domain-batch matrix (all_test_issue_targets)
  # split into AURA_ISSUE_SHARD=i/4 slices, each on its own runner, in
  # parallel with build-test. Each shard compiles aura_test_objects + its
  # slice (LPT-balanced by TU count). The aura executable comes from
  # aura-bin and is installed after this compile, before the tests.
  issue-farm:
    name: issue-farm (${{ matrix.shard }}/4)
    needs: [changes]
    # main push: always. PR: only when src/tests/cmake/… changed.
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.issue_matrix == 'true'
    # A shard is aura_test_objects (~20m) + ~1/4 of the farm (~16m) + tests.
    # actions: write so this job can list aura-bin and keep the pip cache.
    timeout-minutes: 90
    permissions:
      actions: write
      contents: read
      packages: read
    runs-on: ${{ vars.AURA_HEAVY_RUNNER || 'ubuntu-latest' }}
    container:
      image: ghcr.io/cybrid-systems/aura-ci:v0.1.1
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

    - uses: ./.github/actions/ci-krb5

    - uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: pip-${{ runner.os }}-aura-ci-v0.1.1-${{ hashFiles('requirements-dev.txt') }}

    - name: Install Python CI deps
      run: pip install --break-system-packages -r requirements-dev.txt

    - name: Ensure mold / lld
      run: |
        set -e
        need_apt=0
        command -v mold >/dev/null 2>&1 || need_apt=1
        command -v ld.lld >/dev/null 2>&1 || need_apt=1
        if [ "$need_apt" = 1 ]; then
          apt-get update -qq
          command -v mold >/dev/null 2>&1 || apt-get install -y -qq mold || echo "::warning::mold not installed"
          command -v ld.lld >/dev/null 2>&1 || apt-get install -y -qq lld || echo "::warning::lld not installed"
        fi

    - name: Build issue shard
      id: issues-build
      env:
        AURA_ISSUES_TIER: ${{ github.event_name == 'pull_request' && 'fast' || 'full' }}
        AURA_GIT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        AURA_RUNTIME_DIR: ${{ github.workspace }}
        AURA_ISSUE_BUILD: all
        AURA_ISSUE_SHARD: ${{ matrix.shard }}/4
        AURA_SKIP_AURA_BUILD: "1"
        AURA_DEBUG_LEVEL: "1"
      run: |
        set -euo pipefail
        python3 build.py ci-issues --build-only
        if [ -f build/.issue-shard-targets ] && ! grep -q . build/.issue-shard-targets; then
          echo "empty=true" >> "$GITHUB_OUTPUT"
        else
          echo "empty=false" >> "$GITHUB_OUTPUT"
        fi

    # aura-bin is not a needs: dependency. This step runs after the shard
    # compile, which is longer than aura-bin, and only waits if that job
    # is still queued or uploading.
    - name: Wait for aura-bin
      if: success() && steps.issues-build.outputs.empty != 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json, os, time, urllib.error, urllib.request

        repo = os.environ["GITHUB_REPOSITORY"]
        run_id = os.environ["GITHUB_RUN_ID"]
        token = os.environ["GH_TOKEN"]
        headers = {
            "Authorization": f"Bearer {token}",
            "Accept": "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
            "User-Agent": "aura-ci",
        }
        jobs_url = (
            f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs"
            "?per_page=100"
        )
        arts_url = (
            f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts"
            "?per_page=100"
        )
        deadline = time.time() + 40 * 60

        def fetch(url):
            req = urllib.request.Request(url, headers=headers)
            with urllib.request.urlopen(req, timeout=60) as resp:
                return json.load(resp)

        while True:
            try:
                payload = fetch(jobs_url)
                jobs = [j for j in payload.get("jobs", []) if j.get("name") == "aura-bin"]
                if not jobs:
                    print("aura-bin not listed yet")
                else:
                    job = jobs[-1]
                    conclusion = job.get("conclusion") or ""
                    status = job.get("status") or ""
                    print(f"aura-bin status={status} conclusion={conclusion or '-'}")
                    if conclusion in ("failure", "cancelled", "timed_out", "startup_failure"):
                        raise SystemExit(f"aura-bin {conclusion}")
                    if conclusion == "skipped":
                        raise SystemExit("aura-bin skipped")
                    if status == "completed" and conclusion == "success":
                        arts = fetch(arts_url).get("artifacts", [])
                        ready = any(
                            a.get("name") == "aura-compiler" and not a.get("expired")
                            for a in arts
                        )
                        if ready:
                            print("aura-compiler artifact ready")
                            break
                        print("aura-bin succeeded; artifact not listed yet")
            except urllib.error.HTTPError as exc:
                if exc.code in (401, 403):
                    raise SystemExit(
                        f"waiting for aura-bin failed: HTTP {exc.code} "
                        "(issue-farm needs actions: read)"
                    ) from exc
                print(f"list jobs HTTP {exc.code}; retrying")
            except urllib.error.URLError as exc:
                print(f"list jobs error: {exc.reason}; retrying")
            if time.time() > deadline:
                raise SystemExit("timed out waiting for aura-bin")
            time.sleep(20)
        PY

    - name: Download aura
      if: success() && steps.issues-build.outputs.empty != 'true'
      uses: actions/download-artifact@v8
      with:
        name: aura-compiler
        path: .aura-compiler

    - name: Install aura binary
      if: success() && steps.issues-build.outputs.empty != 'true'
      run: |
        set -euo pipefail
        # upload-artifact@v7 with several paths stores them relative to their
        # least common ancestor (build/), so the archive root holds aura and
        # the two .so files. Accept either layout.
        src=.aura-compiler
        if [ ! -f "$src/aura" ] && [ -f "$src/build/aura" ]; then
          src=$src/build
        fi
        test -f "$src/aura"
        install -m 0755 "$src/aura" build/aura
        for so in libaura-reflect.so libaura_tl_arena.so; do
          if [ ! -f "build/$so" ]; then
            install -m 0755 "$src/$so" "build/$so"
          fi
        done
        test -x build/aura
        ldd build/aura
        if ldd build/aura | grep -q 'not found'; then
          echo "::error::aura binary has unresolved shared libraries"
          exit 1
        fi

    - name: Run issue shard
      if: success() && steps.issues-build.outputs.empty != 'true'
      env:
        AURA_ISSUES_TIER: ${{ github.event_name == 'pull_request' && 'fast' || 'full' }}
        AURA_GIT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        AURA_RUNTIME_DIR: ${{ github.workspace }}
        AURA_ISSUE_BUILD: all
        AURA_ISSUE_SHARD: ${{ matrix.shard }}/4
        # Issue #4870 follow-up: the issue batch runs unit tests that toggle
        # production defaults and start an orch scheduler. Without this the
        # Scheduler start gate aborts ("multi-worker needs production
        # bootstrap") before the member can run - seen as an isolated rc=134
        # in test_failure_policy_bridge. All other CI test jobs already set it.
        AURA_SANDBOX: "off"
        AURA_DEBUG_LEVEL: "1"
      run: python3 build.py ci-issues --test-only

    # Issue #2554: PR chaos hard-fail runtime (steal Δ==0, residual==0).
    # Needs aura_test_objects, which only the issue-farm shards compile.
    - name: Chaos PR hard-fail gate (#2554)
      if: matrix.shard == 1
      env:
        AURA_RUNTIME_DIR: ${{ github.workspace }}
        AURA_DEBUG_LEVEL: "1"
      run: python3 build.py chaos-pr-hard-fail

  # Single green check for branch protection when gate ‖ build-test.
  # Succeeds only if gate is green and build-test is green or skipped
  # (docs-only PR: build-test skipped, gate still required).
  # Same Clang module BMI build as gate, on the arm64 toolchain image.
  # Recorded separately from the amd64 gate. Not a manifest check.
  clang-module-arm64:
    needs: [changes]
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    container:
      image: ghcr.io/cybrid-systems/aura-ci:v0.1.1
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 2

    - uses: ./.github/actions/ci-krb5

    - uses: ./.github/actions/clang-scan-deps
      id: clang-scan-deps

    - name: Configure Clang module build (#4837)
      run: >
        cmake -S . -B build_clang -G Ninja -Wno-author
        -Werror=experimental -Wpolicy -Wdeprecated -Wstrict -Wnon-target-directive
        -DCMAKE_CXX_COMPILER=clang++
        -DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS=${{ steps.clang-scan-deps.outputs.path }}
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Build Clang module BMIs (#4837)
      run: |
        targets=$(python3 scripts/clang_module_targets.py build_clang)
        ninja -C build_clang $targets

  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs: [gate, build-test, issue-farm, clang-module-arm64]
    if: always()
    steps:
    - name: Aggregate gate + build-test + issue-farm + arm64 modules
      run: |
        set -e
        gate="${{ needs.gate.result }}"
        bt="${{ needs.build-test.result }}"
        farm="${{ needs.issue-farm.result }}"
        arm="${{ needs.clang-module-arm64.result }}"
        echo "gate=$gate build-test=$bt issue-farm=$farm clang-module-arm64=$arm"
        if [ "$gate" != "success" ]; then
          echo "❌ gate did not succeed ($gate)"
          exit 1
        fi
        if [ "$bt" != "success" ] && [ "$bt" != "skipped" ]; then
          echo "❌ build-test did not succeed ($bt)"
          exit 1
        fi
        if [ "$farm" != "success" ] && [ "$farm" != "skipped" ]; then
          echo "❌ issue-farm did not succeed ($farm)"
          exit 1
        fi
        if [ "$arm" != "success" ] && [ "$arm" != "skipped" ]; then
          echo "❌ clang-module-arm64 did not succeed ($arm)"
          exit 1
        fi
        echo "✓ ci-ok (gate=$gate, build-test=$bt, issue-farm=$farm, clang-module-arm64=$arm)"

  # ASAN track — main only (saves ~8–10m on PRs; PR gate is build-test).
  # Build + verify share one job/container: the old asan-verify job
  # re-pulled the ~10GB image and failed at container init.
  asan-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.AURA_HEAVY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 240  # #2636 belt-and-suspenders: ASAN instrumentation
                          # makes the build materially slower than the
                          # default 360-min budget after recent header
                          # changes (#2632 handoff_ref, #2633 scope BP,
                          # #2634 workspace_generation, #2635 mid-fallback
                          # hard-deny) triggered a full rebuild of all
                          # arena.ixx dependents (~11 TUs). Bumping to
                          # 4h + AURA_LINK_JOBS=1 avoids the documented
                          # link-stage deadlock + the default-timeout
                          # trap. Still uses slim matrix (no issue targets)
                          # to avoid the disk-full failure mode.
    container:
      image: ghcr.io/cybrid-systems/aura-ci:v0.1.1
    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/ci-krb5

    - name: Install Python CI deps
      run: pip install --break-system-packages -r requirements-dev.txt

    # Slim matrix: aura + test_ir + test_concurrent. Skip the 500+
    # issue-bin farm (disk full around link ~1173/1196). concurrent is
    # the stress leaf that SIGSEGVs on x86; asan must see it.
    - name: Build with ASAN
      env:
        AURA_ISSUE_BUILD: none
        AURA_BUILD_TARGETS: aura,test_ir,test_concurrent
        AURA_LINK_JOBS: "1"  # #2636: serialize link to avoid arena.ixx.o
                               # rebuild deadlock (ninja -j2 has been
                               # observed to hang on this stage).
      run: python3 build.py --sanitizer=asan build

    # aura NEEDED shared libs (RUNPATH=$ORIGIN):
    #   - libaura-reflect.so (P2996 SHARED, Issue #2290)
    #   - libaura_tl_arena.so (g_tl_arena TLS SSOT; PRIVATE link from aura)
    # Artifact must ship both .so next to the binaries.
    # Missing .so → asan-verify "cannot open shared object file" (functional
    # fail before any ASAN report).
    - name: Upload ASAN binaries
      uses: actions/upload-artifact@v7
      with:
        name: asan-binaries
        path: |
          build_asan/aura
          build_asan/test_ir
          build_asan/test_concurrent
          build_asan/libaura-reflect.so
          build_asan/libaura_tl_arena.so
        if-no-files-found: error
        retention-days: 1

    # Verification runs in the build container. The old separate
    # asan-verify job re-pulled the ~10GB dev image and that pull failed at
    # "Initialize containers" (Docker pull failed after 3 retries), which
    # skipped every test step. Reusing this container removes that second
    # pull; per-step timeout-minutes keeps the old 40-min hang budget
    # (the default 360-min job budget hid hangs).
    - name: Check ASAN binaries + shared libs
      run: |
        test -x build_asan/aura
        test -x build_asan/test_ir
        test -x build_asan/test_concurrent
        test -f build_asan/libaura-reflect.so
        test -f build_asan/libaura_tl_arena.so
        echo "LD_LIBRARY_PATH=$(pwd)/build_asan${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
        export LD_LIBRARY_PATH="$(pwd)/build_asan${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        ldd build_asan/aura
        if ldd build_asan/aura | grep -q 'not found'; then
          echo "::error::ASAN binary has unresolved shared libraries"
          exit 1
        fi

    # Issue #4889: the offload pool runs compiler jobs on non-fiber worker
    # threads — the only such path in the tree — so exercise it here while
    # the ASAN build is already paid for. test_offload_pool is standalone
    # (links pthread only), so the incremental build is cheap.
    - name: Build offload pool test under ASAN
      run: cmake --build build_asan --target test_offload_pool -j2

    - name: Offload pool under ASAN
      timeout-minutes: 10
      env:
        AURA_SANDBOX: "off"
        ASAN_OPTIONS: "halt_on_error=1:detect_leaks=1"
      run: ./build_asan/test_offload_pool

    # Path: tests/orch/ after R9 layout (was tests/multi_session_leak_test.aura).
    # Use --load so multi-line forms work (stdin Repl is line-oriented and
    # breaks define/if across lines → false FAIL + missing ✅ PASS).
    - name: Multi-session leak test
      timeout-minutes: 12
      env:
        AURA_SANDBOX: "off"
        # Diagnostics face: the leak oracle's digit-parse fn is deliberately
        # walker-side (top-level while/set! per #2770) and the script needs
        # TakeWalker to compute real growth numbers. #3627 binds the pack
        # binary to Forbidden with env unset, which made this step hard-error
        # (and a silent IR-path run returns growth=0 → vacuous PASS). The
        # strict production face is covered by test_pack_pipeline_strict.
        AURA_PIPELINE_STRICT: "0"
      run: |
        set +e
        ASAN_OPTIONS=detect_leaks=1:abort_on_error=0:print_stacktrace=1:exitcode=42 \
          timeout 600 ./build_asan/aura --load tests/orch/multi_session_leak_test.aura \
          > /tmp/asan-multi-session.log 2>&1
        rc=$?
        set -e
        cat /tmp/asan-multi-session.log
        if ! grep -q "✅ PASS" /tmp/asan-multi-session.log; then
          echo "::error::multi-session leak test FAILED (functional)"
          exit 1
        fi
        if [ "$rc" -ne 0 ]; then
          summary=$(grep "SUMMARY: AddressSanitizer" /tmp/asan-multi-session.log | tail -1)
          echo "::error::ASAN leak detected: $summary"
          grep "Direct leak of" /tmp/asan-multi-session.log | head -10
          exit 1
        fi
        echo "✓ No ASAN leaks detected"

    - name: Run unit tests (test_ir) under ASAN
      timeout-minutes: 15
      env:
        ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1:print_stacktrace=1:halt_on_error=1"
        AURA_SANDBOX: "off"
      run: |
        python3 build.py --sanitizer=asan test unit
        echo "✓ unit tests clean under ASAN"

    - name: Run concurrent tests under ASAN
      timeout-minutes: 35
      env:
        ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1:print_stacktrace=1:halt_on_error=1"
        AURA_SANDBOX: "off"
      run: |
        python3 build.py --sanitizer=asan test concurrent
        echo "✓ concurrent tests clean under ASAN"

    - name: Run emit-binary suite (bash) under ASAN
      timeout-minutes: 30
      env:
        ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1:print_stacktrace=1:halt_on_error=1"
        AURA_SANDBOX: "off"
        # Diagnostics face (see multi-session step): bash .aura cases are
        # walker-side scripts, not strict-face fixtures.
        AURA_PIPELINE_STRICT: "0"
      run: |
        AURA=$(pwd)/build_asan/aura bash tests/run-tests.sh
        echo "✓ emit-binary suite clean under ASAN"

  # UBSAN: main only (full rebuild was doubling PR wall time vs build-test).
  # Starts with the other main jobs. Waiting on gate added ~16m and this
  # job does not download anything gate produces.
  ubsan-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.AURA_HEAVY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 240  # #2636 belt-and-suspenders: same rationale as
                          # asan-build (same SLIM matrix + AURA_LINK_JOBS=2
                          # races the arena.ixx.o rebuild deadlock). UBSAN
                          # is materially slower than normal builds after
                          # recent header changes (#2632-#2635) trigger
                          # full rebuild of all arena.ixx dependents.
    container:
      image: ghcr.io/cybrid-systems/aura-ci:v0.1.1
    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/ci-krb5

    - uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: pip-${{ runner.os }}-aura-ci-v0.1.1-${{ hashFiles('requirements-dev.txt') }}

    - name: Install Python CI deps
      run: pip install --break-system-packages -r requirements-dev.txt

    # Slim matrix: aura + test_ir + test_concurrent; skip the issue farm.
    - name: Build with UBSAN
      env:
        AURA_ISSUE_BUILD: none
        AURA_BUILD_TARGETS: aura,test_ir,test_concurrent
        AURA_LINK_JOBS: "1"  # #2636: serialize link to avoid arena.ixx.o
                               # rebuild deadlock (mirrors asan-build fix).
      run: python3 build.py --sanitizer=ubsan build

    - name: Run unit tests under UBSAN
      env:
        UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        # Match asan-verify: production residual Clear + hard paths are
        # covered by dedicated issue tests; unit smoke under UBSAN uses
        # sandbox-off so Guard dtor residual policy stays Soft (legacy).
        AURA_SANDBOX: "off"
      run: |
        python3 build.py --sanitizer=ubsan test unit
        echo "✓ unit tests clean under UBSAN"

    - name: Run concurrent tests under UBSAN
      env:
        UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        AURA_SANDBOX: "off"
      run: |
        python3 build.py --sanitizer=ubsan test concurrent
        echo "✓ concurrent tests clean under UBSAN"

  # Security scan starts immediately (no gate dependency) — overlaps with gate.
  security-scan:
    needs: [changes]
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # The ~10GB dev image pull failed before step 1 on a full runner with
    # "no space left on device". This job only needs stdlib SBOM generation
    # and Trivy (build.py security is a no-op), so run on the runner image.
    steps:
    - uses: actions/checkout@v7

    - uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: pip-${{ runner.os }}-aura-ci-v0.1.1-${{ hashFiles('requirements-dev.txt') }}

    - uses: actions/cache@v6
      with:
        path: ~/.cache/trivy
        key: trivy-db-${{ runner.os }}-v0.72.0
        restore-keys: trivy-db-${{ runner.os }}-

    - name: Install Python CI deps
      run: pip install --break-system-packages -r requirements-dev.txt

    - name: Install Trivy
      run: |
        mkdir -p "$RUNNER_TEMP/bin"
        # Pin the release asset and retry. The upstream install.sh runs its
        # own curl with no retry/backoff, and a transient DNS failure there
        # (curl exit 6) failed this job before the scan ever ran.
        url="https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz"
        ok=0
        for attempt in 1 2 3 4 5; do
          if curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 \
               --connect-timeout 20 \
               -o "$RUNNER_TEMP/trivy.tar.gz" "$url"; then
            ok=1
            break
          fi
          echo "trivy download failed (attempt $attempt); retrying"
          sleep $((attempt * 10))
        done
        test "$ok" = 1
        tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/bin" trivy
        "$RUNNER_TEMP/bin/trivy" --version
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    - name: Security scan
      run: python3 build.py security

    - name: Generate SBOM
      run: python3 build.py sbom --version=ci-${{ github.sha }}

    - name: Upload SBOM artifact
      uses: actions/upload-artifact@v7
      with:
        name: aura-sbom
        path: dist/aura-sbom.json
        if-no-files-found: error
        retention-days: 30

  # Issue #675: dual reproducible Release build verification (main only).
  # Starts with the other main jobs. The two Release trees do not use
  # gate outputs; waiting on gate only delayed this job.
  reproducible-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 240  # Dual sequential Release builds (~2× wall).
                          # AURA_LINK_JOBS=1 serializes link to avoid
                          # arena.ixx.o deadlock (#2636).
    container:
      image: ghcr.io/cybrid-systems/aura-ci:v0.1.1
    env:
      SOURCE_DATE_EPOCH: "1704067200"
      CCACHE_DISABLE: 1
      AURA_LINK_JOBS: "1"
      LC_ALL: C
      TZ: UTC
    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/ci-krb5

    - uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: pip-${{ runner.os }}-aura-ci-v0.1.1-${{ hashFiles('requirements-dev.txt') }}

    - name: Install Python CI deps
      run: pip install --break-system-packages -r requirements-dev.txt

    # Dual sequential clean builds into the same path (build_repro/),
    # compare sha256. Dual-dir (a vs b) previously mismatched because
    # C++20 module / __FILE__ paths leaked the build directory even with
    # source-only -ffile-prefix-map. Prefix maps now cover src+build;
    # same-path sequential is the gold standard for #675.
    - name: Verify reproducible builds match
      run: python3 build.py repro --verify

  # Issue #677: health endpoint smoke (main only).
  # Reuses RelWithDebInfo aura from build-test — no second full compile.
  deployment-health:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.build-test.result == 'success'
    needs: [build-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/cybrid-systems/aura-ci:v0.1.1
    steps:
    - name: Download aura
      uses: actions/download-artifact@v8
      with:
        name: aura-relwithdebinfo
        # Artifact stores workspace-relative paths (build/, lib/).
        # path: build would nest as build/build/aura.
        path: .

    - name: Restore executable bit + shared-lib path
      run: |
        test -f build/aura
        test -f build/libaura-reflect.so
        test -f build/libaura_tl_arena.so
        test -f lib/runtime.c
        chmod +x build/aura
        echo "LD_LIBRARY_PATH=$(pwd)/build${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
        export LD_LIBRARY_PATH="$(pwd)/build${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        ldd build/aura
        if ldd build/aura | grep -q 'libaura-reflect.so => not found'; then
          echo "::error::libaura-reflect.so still not resolved after artifact download"
          exit 1
        fi
        if ldd build/aura | grep -q 'libaura_tl_arena.so => not found'; then
          echo "::error::libaura_tl_arena.so still not resolved after artifact download"
          exit 1
        fi

    - name: Health endpoint smoke
      run: |
        set -euo pipefail
        test -x ./build/aura
        AURA_RUNTIME_DIR=$PWD ./build/aura --health-server 18087 > /tmp/aura-health.log 2>&1 &
        pid=$!
        trap 'kill $pid 2>/dev/null || true' EXIT
        # Wait until the server answers (cold start + bind can take a moment).
        ok=0
        for i in $(seq 1 50); do
          if curl -fsS --max-time 1 http://127.0.0.1:18087/healthz >/dev/null 2>&1; then
            ok=1
            break
          fi
          # Process died early — dump log and fail.
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "aura --health-server exited early:" >&2
            cat /tmp/aura-health.log >&2 || true
            exit 1
          fi
          sleep 0.2
        done
        if [ "$ok" != 1 ]; then
          echo "healthz never became ready:" >&2
          cat /tmp/aura-health.log >&2 || true
          exit 1
        fi
        curl -fsS http://127.0.0.1:18087/healthz | grep -q '^ok'
        curl -fsS http://127.0.0.1:18087/readyz | grep -q '^ready'
        curl -fsS http://127.0.0.1:18087/metrics | grep -q 'aura_up 1'
