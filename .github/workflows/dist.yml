# Issue #4907: prebuilt aura for linux-x86_64 and linux-arm64 on every main push.
#   build   — native runner per arch, inside the toolchain image: build, test, bundle
#   verify  — bare Ubuntu 24.04 runner per arch (no toolchain image) + clean
#             containers (ubuntu:24.04, ubuntu:26.10, Debian 12, Rocky 9,
#             openEuler 24.03 LTS SP4): install.sh, aura new evolve / run / test;
#             build and push the per-arch runtime image
#   publish — rolling `nightly` release (tarballs + sha256) and the multi-arch
#             manifest ghcr.io/cybrid-systems/aura:<sha> and :nightly (no stable
#             channel / :latest until the first vX.Y.Z tag)
# Issue #4934: a `vX.Y.Z` tag push runs the same build + verify, then publishes the
#   stable channel instead: GitHub release vX.Y.Z (tarballs aura-X.Y.Z-linux-<arch>,
#   the names install.sh expects for AURA_VERSION=vX.Y.Z) and the image tags
#   :X.Y.Z, :X.Y and :latest. :latest is only ever set from a tag.
# A failure on either architecture stops the publish.
name: dist

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: dist-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/cybrid-systems/aura
  # bundle version: `nightly` on main, `X.Y.Z` on a vX.Y.Z tag
  VER: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'nightly' }}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    container:
      image: ghcr.io/cybrid-systems/aura-ci:v0.1.0
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-krb5
      - name: Build aura
        run: |
          git config --global --add safe.directory '*'
          cmake -S . -B build -G Ninja -Wno-author -DCMAKE_BUILD_TYPE=Release "-DAURA_BUILD_VERSION=${VER#v}"
          ninja -C build -j3 aura
      - name: Test
        run: |
          pip install --break-system-packages -r requirements-dev.txt
          AURA_TEST_JOBS=4 python3 build.py test bash
          for t in 4912 4913 4914 4909_first_error 4908_cross_mode 4934_version; do
            python3 tests/python/test_issue_$t.py
          done
      - name: Bundle
        run: scripts/tools/bundle.sh build "${VER#v}"
      - uses: actions/upload-artifact@v7
        with:
          name: aura-linux-${{ matrix.arch }}
          path: dist/

  verify:
    needs: build
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: aura-linux-${{ matrix.arch }}
          path: dist
      - name: Install and run on the bare Ubuntu 24.04 runner (${{ matrix.runner }})
        run: |
          . /etc/os-release && echo "host: $PRETTY_NAME $(uname -m), $(ldd --version | head -1)"
          test "$VERSION_ID" = 24.04
          start=$(date +%s)
          AURA_VERSION=$VER AURA_DOWNLOAD_BASE=$PWD/dist sh install.sh
          export PATH=$HOME/.local/bin:$PATH
          cd "$RUNNER_TEMP" && aura new evolve demo && cd demo && aura run && aura test
          test -s out/report.html
          echo "install → report: $(( $(date +%s) - start )) s"
      - name: Clean containers (Ubuntu 24.04, Ubuntu 26.10, Debian 12, Rocky 9, openEuler 24.03 LTS SP4)
        # #4934: v0.1 supported distros. Stock images, nothing installed: install.sh
        # needs only sh, tar+gzip, sha256sum (all in the base images), and the
        # tarballs come from dist/, so no network is needed inside the container.
        run: |
          printf '(display (+ 1 2))\n' > dist/smoke.aura
          for img in ubuntu:24.04 ubuntu:26.10 debian:12 rockylinux/rockylinux:9 openeuler/openeuler:24.03-lts-sp4; do
            echo "::group::$img"
            docker run --rm -e AURA_VERSION="$VER" -v "$PWD:/src:ro" "$img" sh -c '
              set -e; . /etc/os-release; echo "$PRETTY_NAME $(uname -m)"
              AURA_DOWNLOAD_BASE=/src/dist sh /src/install.sh
              a=$HOME/.local/bin/aura
              $a --version | grep -Eq "^aura ${AURA_VERSION#v} \([0-9a-f]{9}\)$"
              test "$($a /src/dist/smoke.aura)" = 3
              cd /tmp && $a new evolve demo && cd demo
              $a run && $a test && test -s out/report.html'
            echo "::endgroup::"
          done
      - name: Runtime image
        run: |
          tag=$IMAGE:${GITHUB_SHA::9}-${{ matrix.arch }}
          docker build -f scripts/docker/Dockerfile --build-arg BUNDLE=dist/aura-${VER#v}-linux-${{ matrix.arch }}.tar.gz -t "$tag" .
          size=$(docker image inspect -f '{{.Size}}' "$tag")
          echo "image $tag: $((size / 1048576)) MB"
          test "$size" -lt 524288000
          mkdir -p "$RUNNER_TEMP/w" && cd "$RUNNER_TEMP/w"
          printf '(display (+ 1 2))\n' > main.aura
          test "$(docker run --rm -v "$PWD:/w" -w /w "$tag" main.aura)" = 3
      - name: Push the per-arch image
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${GITHUB_SHA::9}-${{ matrix.arch }}"

  publish:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: aura-linux-*
          path: dist
          merge-multiple: true
      - name: nightly release
        if: env.VER == 'nightly'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="aura nightly @ ${GITHUB_SHA::9}

          - linux-x86_64 and linux-arm64 tarballs (+ .sha256). Each carries its own loader,
            glibc 2.44 and libstdc++ (rt/), so the host glibc does not matter. Verified on
            Ubuntu 24.04, Ubuntu 26.10, Debian 12, Rocky Linux 9, and openEuler 24.03 LTS SP4,
            x86_64 and arm64. Needs Linux >= 3.2.
          - install: curl -fsSL https://raw.githubusercontent.com/cybrid-systems/aura/main/install.sh | sh
          - image: docker run --rm -v \$PWD:/w -w /w $IMAGE:nightly main.aura"
          gh release view nightly >/dev/null 2>&1 ||
            gh release create nightly --prerelease --title "aura nightly" --notes "$notes"
          gh release edit nightly --notes "$notes"
          gh release upload nightly dist/*.tar.gz dist/*.sha256 --clobber
      - name: stable release
        if: env.VER != 'nightly'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          v=${VER#v}
          notes="aura $VER

          - linux-x86_64 and linux-arm64 tarballs (+ .sha256), verified on
            Ubuntu 24.04, Ubuntu 26.10, Debian 12, Rocky Linux 9, and openEuler 24.03 LTS SP4,
            x86_64 and arm64.
          - install: curl -fsSL https://raw.githubusercontent.com/cybrid-systems/aura/main/install.sh | AURA_VERSION=$VER sh
          - image: docker run --rm -v \$PWD:/w -w /w $IMAGE:$v main.aura"
          gh release view "$VER" >/dev/null 2>&1 ||
            gh release create "$VER" --verify-tag --title "aura $VER" --notes "$notes"
          gh release upload "$VER" dist/*.tar.gz dist/*.sha256 --clobber
      - name: multi-arch manifest
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          s=${GITHUB_SHA::9}
          if [ "$VER" = nightly ]; then
            tags="-t $IMAGE:$s -t $IMAGE:nightly"
          else
            v=${VER#v}
            tags="-t $IMAGE:$s -t $IMAGE:$v -t $IMAGE:${v%.*} -t $IMAGE:latest"
          fi
          docker buildx imagetools create $tags "$IMAGE:$s-x86_64" "$IMAGE:$s-arm64"
