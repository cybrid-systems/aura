# Issue #4907: prebuilt aura for linux-x86_64 and linux-arm64 on every main push.
#   build   — native runner per arch, inside the toolchain image: build, test, bundle
#   verify  — bare runner per arch (no toolchain image) + ubuntu:22.04: install.sh,
#             aura new evolve / run / test; build and push the per-arch runtime image
#   publish — rolling `nightly` release (tarballs + sha256) and the multi-arch
#             manifest ghcr.io/cybrid-systems/aura:<sha> and :nightly
# A failure on either architecture stops the publish.
name: dist

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: dist-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/cybrid-systems/aura

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-latest, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    container:
      image: ghcr.io/cybrid-systems/dev:v1.1.1
    steps:
      - uses: actions/checkout@v7
      - name: Build aura
        run: |
          git config --global --add safe.directory '*'
          cmake -S . -B build -G Ninja -Wno-author -DCMAKE_BUILD_TYPE=Release
          ninja -C build -j3 aura
      - name: Test
        run: |
          pip install --break-system-packages -r requirements-dev.txt
          AURA_TEST_JOBS=4 python3 build.py test bash
          for t in 4912 4913 4914 4909_first_error 4908_cross_mode; do
            python3 tests/python/test_issue_$t.py
          done
      - name: Bundle
        run: scripts/tools/bundle.sh build nightly
      - uses: actions/upload-artifact@v7
        with:
          name: aura-linux-${{ matrix.arch }}
          path: dist/

  verify:
    needs: build
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-latest, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: aura-linux-${{ matrix.arch }}
          path: dist
      - name: Install and run on the bare runner (host glibc ${{ matrix.runner }})
        run: |
          start=$(date +%s)
          AURA_DOWNLOAD_BASE=$PWD/dist sh install.sh
          export PATH=$HOME/.local/bin:$PATH
          cd "$RUNNER_TEMP" && aura new evolve demo && cd demo && aura run && aura test
          test -s out/report.html
          echo "install → report: $(( $(date +%s) - start )) s"
      - name: Ubuntu 22.04 (glibc 2.35)
        run: |
          docker run --rm -v "$PWD:/src" ubuntu:22.04 sh -c '
            AURA_DOWNLOAD_BASE=/src/dist sh /src/install.sh &&
            cd /tmp && ~/.local/bin/aura new evolve demo && cd demo &&
            ~/.local/bin/aura run && test -s out/report.html'
      - name: Runtime image
        run: |
          tag=$IMAGE:${GITHUB_SHA::9}-${{ matrix.arch }}
          docker build -f scripts/docker/Dockerfile --build-arg BUNDLE=dist/aura-nightly-linux-${{ matrix.arch }}.tar.gz -t "$tag" .
          size=$(docker image inspect -f '{{.Size}}' "$tag")
          echo "image $tag: $((size / 1048576)) MB"
          test "$size" -lt 524288000
          mkdir -p "$RUNNER_TEMP/w" && cd "$RUNNER_TEMP/w"
          printf '(display (+ 1 2))\n' > main.aura
          test "$(docker run --rm -v "$PWD:/w" -w /w "$tag" main.aura)" = 3
      - name: Push the per-arch image
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${GITHUB_SHA::9}-${{ matrix.arch }}"

  publish:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: aura-linux-*
          path: dist
          merge-multiple: true
      - name: nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="aura nightly @ ${GITHUB_SHA::9}

          - linux-x86_64 and linux-arm64 tarballs (+ .sha256). Each carries its own loader,
            glibc 2.44 and libstdc++ (rt/), so the host glibc does not matter: Ubuntu 22.04
            (glibc 2.35) and 24.04 (2.39) run it on both architectures. Needs Linux >= 3.2.
          - install: curl -fsSL https://raw.githubusercontent.com/cybrid-systems/aura/main/install.sh | sh
          - image: docker run --rm -v \$PWD:/w -w /w $IMAGE:nightly main.aura"
          gh release view nightly >/dev/null 2>&1 ||
            gh release create nightly --prerelease --title "aura nightly" --notes "$notes"
          gh release edit nightly --notes "$notes"
          gh release upload nightly dist/*.tar.gz dist/*.sha256 --clobber
      - name: multi-arch manifest
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          s=${GITHUB_SHA::9}
          docker buildx imagetools create -t "$IMAGE:$s" -t "$IMAGE:nightly" -t "$IMAGE:latest" "$IMAGE:$s-x86_64" "$IMAGE:$s-arm64"
