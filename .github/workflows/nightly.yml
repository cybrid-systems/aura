# Issue #675: nightly extended fuzz + sanitizer stress (non-blocking on PRs).
# Issue #1933: LLVM source-based coverage artifact job.
# Issue #1935: unified fuzz orchestrator.
# Issue #2380 / #2513: production-concurrency gate (lock-order canary + full chaos).
# Issue #2931: steal×mutate×GC×mailbox chaos soak hard gate
#   (AURA_CHAOS_STEAL_GC=1, duration≥600s, workers≥8; residual-after-exit +
#   resume-fence fail-closed). EXCLUDE_FROM_ALL — not part of default PR test.
# Deploy-class soak: AURA_CHAOS_SOAK=1 AURA_CHAOS_FIBERS=256..1000
#   AURA_CHAOS_DURATION_S=300+ (local / long runners only).
name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  AURA_BUILD_JOBS: "0"
  AURA_TEST_JOBS: "4"
  CCACHE_DISABLE: 1

jobs:
  # Issue #2931: steal×mutate×GC×mailbox chaos soak as nightly hard gate.
  # Fail-closed: residual_defer_after_exit without matching clears,
  # resume_fence_fail / ticket-mismatch hard surplus, residual_defer_steal
  # hard-fail, residual bits still armed. PR default remains
  # EXCLUDE_FROM_ALL + AURA_CHAOS_STEAL_GC env gate.
  chaos-steal-gc-nightly:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cybrid-systems/dev:v1.0.5
    steps:
    - uses: actions/checkout@v7

    - name: Install Python CI deps
      run: pip install --break-system-packages -r requirements-dev.txt

    - name: Build
      run: python3 build.py build

    # Builds + runs test_chaos_steal_mutation_gc under the env matrix below
    # (see build.py cmd_chaos_steal_gc_nightly_2931). Soft steal forbidden.
    - name: chaos steal-gc nightly hard gate (#2931)
      env:
        AURA_CHAOS_STEAL_GC: "1"
        AURA_CHAOS_DURATION_S: "600"
        AURA_CHAOS_WORKERS: "8"
      run: |
        python3 build.py chaos-steal-gc-nightly-2931
        echo "✓ chaos-steal-gc-nightly green (duration≥600 workers≥8 residual/resume fail-closed)"

  # Issue #2380 / #2513: nightly production-concurrency hard gate.
  # Hard-fail: hang / residual defer / snapshot mismatch / steal hard-fail /
  # residual still-running > 0 / densify fail / lock-order canary / Soft steal /
  # mailbox hold-starvation over AURA_CHAOS_MB_STARVE_MAX.
  # PR CI stays smoke-only (no FULL / no PRODUCTION_CONCURRENCY_GATE).
  production-concurrency:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cybrid-systems/dev:v1.0.5
    steps:
    - uses: actions/checkout@v7

    - name: Install Python CI deps
      run: pip install --break-system-packages -r requirements-dev.txt

    - name: Build
      run: python3 build.py build

    - name: production-concurrency gate (#2380 / #2513)
      env:
        AURA_PRODUCTION_CONCURRENCY_GATE: "1"
        AURA_LOCK_ORDER_CANARY: "1"
        AURA_CHAOS_FULL: "1"
        AURA_CHAOS_SEED: "1"
        AURA_CHAOS_WORKERS: "4"
        AURA_CHAOS_FIBERS: "128"
        AURA_CHAOS_DURATION_S: "30"
        AURA_CHAOS_MB_STARVE_MAX: "0"
      run: |
        python3 build.py production-concurrency
        echo "✓ production-concurrency green (canary + full chaos; soak via AURA_CHAOS_SOAK=1)"

  fuzz-extended:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cybrid-systems/dev:v1.0.5
    steps:
    - uses: actions/checkout@v7

    - name: Install Python CI deps
      run: pip install --break-system-packages -r requirements-dev.txt

    - name: Build
      run: python3 build.py build

    - name: List fuzzers
      run: python3 build.py fuzz --list

    - name: Corpus status
      run: python3 tests/fuzz/corpus_tools.py status

    - name: Extended fuzz (orchestrator subset)
      run: |
        python3 build.py fuzz --only core,corpus,hygiene_prop --quick --continue-on-error --json \
          | tee fuzz-summary.json || true
        echo "✓ extended fuzz complete"

    - name: Upload fuzz summary / reproducers
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: fuzz-nightly
        path: |
          fuzz-summary.json
          tests/fuzz/reproducers/
        if-no-files-found: warn

  tsan-smoke:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cybrid-systems/aura-ci:v1.0.1
    steps:
    - uses: actions/checkout@v7

    - name: Install Python CI deps
      run: pip install --break-system-packages -r requirements-dev.txt

    - name: Build with TSAN
      run: python3 build.py --sanitizer=tsan build

    - name: Run concurrent tests under TSAN
      env:
        TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1"
      run: |
        python3 build.py --sanitizer=tsan test concurrent
        echo "✓ concurrent tests clean under TSAN"

  coverage:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cybrid-systems/dev:v1.0.5
    steps:
    - uses: actions/checkout@v7

    - name: Install Python CI deps
      run: pip install --break-system-packages -r requirements-dev.txt

    - name: Tooling smoke
      run: python3 build.py coverage --check-tools

    - name: Instrumented coverage report
      run: python3 build.py coverage --html --suite smoke
      continue-on-error: true

    - name: Upload coverage HTML/JSON
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: llvm-coverage
        path: build_coverage/coverage/
        if-no-files-found: warn
