# Issue #675: nightly extended fuzz + sanitizer stress (non-blocking on PRs).
# Version tags are not published here. nightly-version.yml moves
# nightly-YYYY.MM.DD after CI succeeds on main.
# Issue #1933: LLVM source-based coverage artifact job.
# Issue #1935: unified fuzz orchestrator.
# Issue #2380 / #2513: production-concurrency gate (lock-order canary + full chaos).
# Issue #2931: steal×mutate×GC×mailbox chaos soak hard gate
#   (AURA_CHAOS_STEAL_GC=1, duration≥600s, workers≥8; residual-after-exit +
#   resume-fence fail-closed). EXCLUDE_FROM_ALL — not part of default PR test.
# Deploy-class soak: AURA_CHAOS_SOAK=1 AURA_CHAOS_FIBERS=256..1000
#   AURA_CHAOS_DURATION_S=300+ (local / long runners only).
name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  AURA_BUILD_JOBS: "0"
  AURA_TEST_JOBS: "4"
  CCACHE_DISABLE: 1

jobs:
  # Issue #5211: the fiber guard overflow test must run on arm64, where the
  # guard is 64 KiB (GCC's default stack-clash probe assumption) and the
  # worker alternate signal stack is what keeps the AURA CRASH banner from
  # taking a second SIGSEGV.
  fiber-guard-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    container:
      image: ghcr.io/cybrid-systems/aura-ci:latest
    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/ci-krb5

    - name: Install Python CI deps
      run: pip install --break-system-packages -r requirements-dev.txt

    - name: Build and run fiber guard hardening (#5211)
      env:
        AURA_DEBUG_LEVEL: "1"
      run: |
        cmake -S . -B build -G Ninja -Wno-author \
          -Werror=experimental -Wpolicy -Wdeprecated -Wstrict -Wnon-target-directive \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        ninja -C build -j 4 test_fiber_guard_hardening
        ./build/test_fiber_guard_hardening

  # #5429/#5430: LLVM SpecJIT test + AST hotpath bench on arm64. The
  # hotpath AC is allocation-based (platform-independent); the arm64
  # timing is recorded in the log for the #398 platform comparison.
  spec-jit-hotpath-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    container:
      image: ghcr.io/cybrid-systems/aura-ci:latest
    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/ci-krb5

    - name: Install Python CI deps
      run: pip install --break-system-packages -r requirements-dev.txt

    - name: Build and run spec-JIT + AST hotpath (#5429/#5430)
      env:
        AURA_DEBUG_LEVEL: "1"
      run: |
        cmake -S . -B build -G Ninja -Wno-author \
          -Werror=experimental -Wpolicy -Wdeprecated -Wstrict -Wnon-target-directive \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        ninja -C build -j 4 ast_hotpath_bench test_spec_jit
        ./build/ast_hotpath_bench
        ./build/test_spec_jit

  # Issue #5637: alloc RSS / minor-fault / slope / ratio gate.
  # linux-x86_64 has no measured baseline yet, so this job is arm64 only.
  # An empty platform object is record-only; this one checks.
  alloc-bench-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    container:
      image: ghcr.io/cybrid-systems/aura-ci:latest
    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/ci-krb5

    - name: Install Python CI deps
      run: pip install --break-system-packages -r requirements-dev.txt

    - name: Alloc bench gate (#5637)
      env:
        AURA_DEBUG_LEVEL: "1"
      run: |
        cmake -S . -B build -G Ninja -Wno-author \
          -Werror=experimental -Wpolicy -Wdeprecated -Wstrict -Wnon-target-directive \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        ninja -C build -j 4 aura
        python3 tests/bench/alloc_bench.py --check

  # Issue #2931: steal×mutate×GC×mailbox chaos soak as nightly hard gate.
  # Fail-closed: residual_defer_after_exit without matching clears,
  # resume_fence_fail / ticket-mismatch hard surplus, residual_defer_steal
  # hard-fail, residual bits still armed. PR default remains
  # EXCLUDE_FROM_ALL + AURA_CHAOS_STEAL_GC env gate.
  chaos-steal-gc-nightly:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cybrid-systems/aura-ci:latest
    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/ci-krb5

    - name: Install Python CI deps
      run: pip install --break-system-packages -r requirements-dev.txt

    # Configure only: the gate below builds test_chaos_steal_mutation_gc
    # itself (it pulls in libaura_test_objects). A bare `build.py build`
    # compiled the whole issue matrix first — 71.7 min on run 46139267882
    # (#5646).
    - name: Configure
      run: python3 build.py configure

    # Builds + runs test_chaos_steal_mutation_gc under the env matrix below
    # (see build.py cmd_chaos_steal_gc_nightly_2931). Soft steal forbidden.
    - name: chaos steal-gc nightly hard gate (#2931)
      env:
        AURA_CHAOS_STEAL_GC: "1"
        AURA_CHAOS_DURATION_S: "600"
        AURA_CHAOS_WORKERS: "8"
      run: |
        python3 build.py chaos-steal-gc-nightly-2931
        echo "✓ chaos-steal-gc-nightly green (duration≥600 workers≥8 residual/resume fail-closed)"

  # Issue #2380 / #2513: nightly production-concurrency hard gate.
  # Hard-fail: hang / residual defer / snapshot mismatch / steal hard-fail /
  # residual still-running > 0 / densify fail / lock-order canary / Soft steal /
  # mailbox hold-starvation over AURA_CHAOS_MB_STARVE_MAX.
  # PR CI stays smoke-only (no FULL / no PRODUCTION_CONCURRENCY_GATE).
  production-concurrency:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cybrid-systems/aura-ci:latest
    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/ci-krb5

    - name: Install Python CI deps
      run: pip install --break-system-packages -r requirements-dev.txt

    # Configure only: the gate below builds test_chaos_mutate_steal_gc_mailbox
    # itself (it pulls in libaura_test_objects). A bare `build.py build`
    # compiled the whole issue matrix first — 58.6 min on run 46139267882
    # (#5646).
    - name: Configure
      run: python3 build.py configure

    - name: production-concurrency gate (#2380 / #2513)
      env:
        AURA_PRODUCTION_CONCURRENCY_GATE: "1"
        AURA_LOCK_ORDER_CANARY: "1"
        AURA_CHAOS_FULL: "1"
        AURA_CHAOS_SEED: "1"
        AURA_CHAOS_WORKERS: "4"
        AURA_CHAOS_FIBERS: "128"
        AURA_CHAOS_DURATION_S: "30"
        AURA_CHAOS_MB_STARVE_MAX: "0"
      run: |
        python3 build.py production-concurrency
        echo "✓ production-concurrency green (canary + full chaos; soak via AURA_CHAOS_SOAK=1)"

  fuzz-extended:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cybrid-systems/aura-ci:latest
    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/ci-krb5

    - name: Install Python CI deps
      run: pip install --break-system-packages -r requirements-dev.txt

    # The fuzzers only drive build/aura (tests/fuzz/common.py AURA_BIN). A
    # bare `build.py build` compiled the whole issue matrix first — 70.5 min
    # on run 46139267882 (#5646).
    - name: Build aura
      env:
        AURA_BUILD_TARGETS: aura
        AURA_ISSUE_BUILD: none
      run: python3 build.py build

    - name: List fuzzers
      run: python3 build.py fuzz --list

    - name: Corpus status
      run: python3 tests/fuzz/corpus_tools.py status

    - name: Extended fuzz (orchestrator subset)
      run: |
        python3 build.py fuzz --only core,corpus,hygiene_prop --quick --continue-on-error --json \
          | tee fuzz-summary.json || true
        echo "✓ extended fuzz complete"

    - name: Upload fuzz summary / reproducers
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: fuzz-nightly
        path: |
          fuzz-summary.json
          tests/fuzz/reproducers/
        if-no-files-found: warn

  tsan-smoke:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cybrid-systems/aura-ci:latest
    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/ci-krb5

    - name: Install Python CI deps
      run: pip install --break-system-packages -r requirements-dev.txt

    - name: Build with TSAN
      run: python3 build.py --sanitizer=tsan build

    - name: Run concurrent tests under TSAN
      env:
        TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1"
      run: |
        python3 build.py --sanitizer=tsan test concurrent
        echo "✓ concurrent tests clean under TSAN"

    # Issue #4889: TSAN is the only race detector that covers the offload
    # worker threads and the thread-private CompilerService (#4881).
    - name: Build offload pool test under TSAN
      run: cmake --build build_tsan --target test_offload_pool -j2

    - name: Offload pool under TSAN
      env:
        TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1"
        AURA_SANDBOX: "off"
      run: ./build_tsan/test_offload_pool

  # Issue #4889: 10-minute-shape soak. The round count is the knob; the
  # test measures VmRSS inside the process and asserts <10% growth plus a
  # drained queue.
  offload-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/cybrid-systems/aura-ci:latest
    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/ci-krb5

    - name: Install Python CI deps
      run: pip install --break-system-packages -r requirements-dev.txt

    # test_offload_soak.py only drives build/aura. A bare `build.py build`
    # compiled the whole issue matrix first — 49.2 min on run 46139267882
    # (#5646).
    - name: Build aura
      env:
        AURA_BUILD_TARGETS: aura
        AURA_ISSUE_BUILD: none
      run: python3 build.py build

    - name: Offload submit/await soak
      env:
        AURA_SANDBOX: "off"
        AURA_OFFLOAD_SOAK_ROUNDS: "20000"
      run: python3 tests/python/process/test_offload_soak.py -v

  coverage:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cybrid-systems/aura-ci:latest
    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/ci-krb5

    - name: Install Python CI deps
      run: pip install --break-system-packages -r requirements-dev.txt

    - name: Tooling smoke
      run: python3 build.py coverage --check-tools

    - name: Instrumented coverage report
      run: python3 build.py coverage --html --suite smoke
      continue-on-error: true

    - name: Upload coverage HTML/JSON
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: llvm-coverage
        path: build_coverage/coverage/
        if-no-files-found: warn
