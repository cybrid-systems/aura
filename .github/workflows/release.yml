# Issue #677: release artifacts (tarball + SBOM) on tag push.
name: Release

on:
  push:
    tags:
      - "v*"

env:
  SOURCE_DATE_EPOCH: "1704067200"
  CCACHE_DISABLE: 1

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cybrid-systems/aura-ci:v0.1.1
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/ci-krb5

      - name: Install Python CI deps
        run: pip install --break-system-packages -r requirements-dev.txt

      - name: Build release tarball
        env:
          AURA_GIT_SHA: ${{ github.sha }}
          AURA_REQUIRE_GIT_SHA: "1"
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/tools/release.sh "$VERSION"  # #4907: was ./scripts/release.sh (missing)

      # Issue #5203: install the 4.5 export set, assert the native SPDX
      # document, and prove a consumer can find_package + link the targets.
      - name: Install + native SPDX smoke (#5203)
        run: |
          PREFIX="$RUNNER_TEMP/aura-install"
          # release.sh builds only the `aura` target; the export set the
          # install step ships (aura::core, aura::fiber_rt + headers) has
          # to be built first or file(INSTALL) fails on libaura_core.a.
          cmake --build build_repro --target aura_core aura_fiber_rt
          cmake --install build_repro --prefix "$PREFIX" >/dev/null
          # repro is a Release build, so CMake names the SBOM for that config.
          SPDX="$PREFIX/lib/sbom/aura-targets/aura-targets-Release.spdx.json"
          test -f "$SPDX"
          grep -q 'spdx.org/rdf/3.0.1' "$SPDX"
          mkdir -p "$RUNNER_TEMP/aura-consumer"
          printf '%s\n' 'cmake_minimum_required(VERSION 4.5)' 'project(c LANGUAGES CXX)' 'find_package(aura CONFIG REQUIRED)' 'add_executable(c main.cpp)' 'target_link_libraries(c PRIVATE aura::core aura::fiber_rt)' > "$RUNNER_TEMP/aura-consumer/CMakeLists.txt"
          printf '%s\n' 'int main(){return 0;}' > "$RUNNER_TEMP/aura-consumer/main.cpp"
          cmake -S "$RUNNER_TEMP/aura-consumer" -B "$RUNNER_TEMP/aura-consumer/build" -DCMAKE_PREFIX_PATH="$PREFIX" >/dev/null
          cmake --build "$RUNNER_TEMP/aura-consumer/build" >/dev/null

      # release.sh configures build_repro/ for the tarball. The chaos SOAK
      # hard gate builds and runs test_chaos_mutate_steal_gc_mailbox from
      # the default build directory. Configure that tree here, in Release,
      # so the next step executes the soak instead of stopping on a missing
      # CMakeCache after static coverage.
      - name: Configure the build the chaos SOAK hard gate runs
        env:
          AURA_BUILD_TYPE: Release
        run: python3 build.py configure

      # Issue #2722: RELEASE chaos SOAK hard deploy gate. Required for
      # any tag / release candidate that claims multi-fiber mutation
      # safety. Runs the full SOAK (300s / 8 workers / 256 fibers)
      # under production_defaults_active + Hard fail-closed semantics.
      # If any residual panic / LayoutStamp mismatch / live MutationHold
      # / steal-after-degrade fires, the gate fails (exit non-zero) and
      # the release-asset upload step below is skipped. Static contract
      # is asserted by scripts/coverage/checks/check_chaos_soak_hard_gate_2722.py
      # (also wired in build.py gate chain).
      - name: chaos SOAK hard gate (#2722) + production concurrency Ready residual gate (#4159)
        run: |
          python3 build.py chaos-soak-hard-gate-2722-coverage
          python3 build.py chaos-soak-hard-gate-2722
          # Issue #4159: the deploy AND is mandatory on the production
          # concurrency Ready face — this step re-proves the continuous
          # residual-zero + sticky-clear deploy gate (soak term re-run is
          # idempotent) before any release asset uploads.
          python3 build.py production-concurrency-ready-gate-4159

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/aura-*.tar.gz
            dist/aura-*.tar.gz.sha256
            dist/aura-sbom.json
          generate_release_notes: true
